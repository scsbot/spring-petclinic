# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
# [Spring Advisor]: This property disables health-group-membership-validation with boot 3.1 for backwards compatible reasons, but the Spring team encourages to enable it.
management.endpoint.health.validate-group-membership=false
# TODO: [Advisor] Strongly recommended to configure the `management.endpoints.jmx.exposure.include` to expose ONLY required information
management.endpoints.jmx.exposure.include=*
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# legacy PG/RabbitMQ settings, kept for the demo
# TODO [PG17.10-oldsnapshot]: old_snapshot_threshold removed in PG17 - no replacement, this protection no longer exists
# old_snapshot_threshold=-1
# TODO [PG17.10-tracerecovery]: trace_recovery_messages removed in PG17 - no replacement
# trace_recovery_messages=notice
# TODO [PG17.10-userns]: db_user_namespace removed in PG17 - no replacement, this deprecated auth mechanism no longer exists
# db_user_namespace=off
# TODO [RMQ4.3.4]: cluster_partition_handling is a no-op - remove or re-plan
cluster_partition_handling=pause_minority
# TODO [RMQ4.3.4-globalqos]: global_qos is silently downgraded to per-consumer prefetch (N x M messages may be in flight, not N) - verify that's acceptable, or restructure to per-consumer channels.
spring.rabbitmq.listener.simple.global-qos=true
